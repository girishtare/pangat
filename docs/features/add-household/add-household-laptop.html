<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add one household (laptop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@600&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5efe1}
a{color:#790d16}a:hover{color:#5c0a11}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: rgba(43, 29, 22, 0.55); display: flex; align-items: center; justify-content: center; color: #2e1a1c; font-family: 'IBM Plex Sans', 'Noto Sans Devanagari', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
  <section role="dialog" aria-labelledby="t" style="width: 768px; max-height: 868px; box-sizing: border-box; background: #fffcf5; border: 1px solid #e5d3af; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.5)">

    <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; background: #ebe1cb; border-bottom: 1px solid #e5d3af">
      <h2 id="t" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #790d16">Add one household</h2>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #790d16; font-size: 22px">×</button>
    </header>

    <form style="padding: 14px 20px 6px; display: grid; gap: 12px">
      <!-- NAME + LOCATION, English | Marathi -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; align-items: end">
        <div style="grid-column: 1 / -1; font-weight: 600; font-size: 14px">Name</div>
        <label><span style="display: block; font-size: 13px; color: #5e4446; margin-bottom: 3px">In English</span><input placeholder="Shri. A. Joshi &amp; family" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></label>
        <label><span style="display: block; font-size: 13px; color: #5e4446; margin-bottom: 3px">In Marathi <span style="color: #5e4446">(optional)</span></span><input lang="mr" placeholder="श्री. अ. जोशी सहपरिवार" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></label>

        <div style="grid-column: 1 / -1; font-weight: 600; font-size: 14px; margin-top: 6px">Location <span style="font-weight: 400; color: #5e4446">(where they stay, optional)</span></div>
        <label><span style="display: block; font-size: 13px; color: #5e4446; margin-bottom: 3px">In English</span><input placeholder="e.g. Borivali, Mumbai" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></label>
        <label><span style="display: block; font-size: 13px; color: #5e4446; margin-bottom: 3px">In Marathi</span><input lang="mr" placeholder="उदा. बोरिवली, मुंबई" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></label>

        <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 2px">
          <span style="font-size: 13px; color: #5e4446">Fills both Marathi boxes from the English. Check before you save.</span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid #790d16; background: #fffcf5; color: #790d16; font: inherit; font-size: 14px; font-weight: 600">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>Suggest Marathi
          </button>
        </div>
      </div>

      <div aria-hidden="true" style="height: 1px; background: #e5d3af"></div>

      <!-- SIDE | MOBILE -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <fieldset style="margin: 0; padding: 0; border: 0"><legend style="font-weight: 600; font-size: 14px; margin-bottom: 4px">Side</legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 2px solid #790d16; background: #790d16; color: #ffffff; font-weight: 600"><input type="radio" name="side" checked style="position: absolute; opacity: 0">Bride's side</label>
            <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 2px solid #e5d3af; background: #ffffff; font-weight: 600"><input type="radio" name="side" style="position: absolute; opacity: 0">Groom's side</label>
          </div>
        </fieldset>
        <label><span style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px">Mobile <span style="font-weight: 400; color: #5e4446">(for WhatsApp; blank if none)</span></span>
          <span style="display: flex; gap: 6px"><select aria-label="Country code" style="width: 8.5rem; min-height: 44px; padding: 0 8px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"><option>+91 India</option></select><input type="tel" placeholder="98765 43210" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></span></label>
      </div>

      <!-- LANGUAGE | INVITE BY -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <fieldset style="margin: 0; padding: 0; border: 0"><legend style="font-weight: 600; font-size: 14px; margin-bottom: 4px">Language <span style="font-weight: 400; color: #5e4446">(slip, WhatsApp, reply page)</span></legend>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <label lang="mr" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 2px solid #e5d3af; background: #ffffff; font-weight: 600"><input type="radio" name="lang" style="position: absolute; opacity: 0">मराठी</label>
            <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 2px solid #e5d3af; background: #ffffff; font-weight: 600"><input type="radio" name="lang" style="position: absolute; opacity: 0">English</label>
            <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 2px solid #790d16; background: #790d16; color: #ffffff; font-weight: 600"><input type="radio" name="lang" checked style="position: absolute; opacity: 0">Both</label>
          </div>
        </fieldset>
        <fieldset style="margin: 0; padding: 0; border: 0"><legend style="font-weight: 600; font-size: 14px; margin-bottom: 4px">Send the invitation by</legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <label style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 12px; border: 2px solid #4f6b80; background: #dfe8ef; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #790d16">Card</label>
            <label title="Enter a mobile to enable" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 12px; border: 2px solid #e5d3af; background: #ffffff; color: #8a7466; font-weight: 600"><input type="checkbox" disabled style="width: 18px; height: 18px">WhatsApp</label>
          </div>
        </fieldset>
      </div>

      <!-- INVITED TO -->
      <fieldset style="margin: 0; padding: 0; border: 0"><legend style="font-weight: 600; font-size: 14px; margin-bottom: 4px">Invited to</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4f6b80; background: #dfe8ef; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #790d16">Anish's Haldi</label>
          <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4f6b80; background: #dfe8ef; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #790d16">Manali's Haldi</label>
          <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4f6b80; background: #dfe8ef; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #790d16">Wedding</label>
          <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #4f6b80; background: #dfe8ef; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #790d16">Reception</label>
        </div>
      </fieldset>

      <!-- COUNT | NOTES -->
      <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px">
        <label><span style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px">Guest Count <span style="font-weight: 400; color: #5e4446">(optional)</span></span><input type="number" placeholder="e.g. 6" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></label>
        <label><span style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px">Comments / Notes <span style="font-weight: 400; color: #5e4446">(optional)</span></span><input placeholder="e.g. Vegetarian only; call before visiting" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid #e5d3af; border-radius: 12px; background: #ffffff; font: inherit"></label>
      </div>
    </form>

    <footer style="margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid #e5d3af; background: #fffcf5">
      <p role="status" style="margin: 0; font-size: 14px; color: #1d6b3f; font-weight: 600">✓ Added Shri. Anil Joshi &amp; family · code <span style="font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.15em">K7M2QX</span></p>
      <div style="display: flex; gap: 8px">
        <button type="submit" style="min-height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid #790d16; background: #fffcf5; color: #790d16; font: inherit; font-weight: 600">Save household and add new</button>
        <button type="submit" style="min-height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid #790d16; background: #790d16; color: #ffffff; font: inherit; font-weight: 600">Save household and close</button>
      </div>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
